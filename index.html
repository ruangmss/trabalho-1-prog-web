<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./src/styles/output.css" />

    <title>Reserva Fácil</title>
  </head>
  <body class="min-h-screen flex flex-col">
    <header class="border-b-2 border-gray-200">
      <div
        class="flex justify-between container mx-auto px-8 py-4 items-center max-sm:flex-col max-sm:justify-start max-sm:items-start max-sm: gap-4"
      >
        <div class="flex flex-col gap-1">
          <h1 class="text-2xl font-bold">Reserva Fácil</h1>
          <p class="text-sm text-slate-600 font-semibold">
            Gerencie reservas de salas e laboratórios.
          </p>
        </div>

        <button
          id="open-reservation-modal"
          class="px-4 py-2 rounded-lg bg-blue-600 text-white max-w-max text-sm font-semibold hover:bg-blue-700 cursor-pointer"
        >
          Novo Agendamento
        </button>
      </div>
    </header>

    <main class="bg-gray-100 flex-1">
      <section class="container mx-auto px-8 py-4 flex gap-4 justify-center max-md:flex-col">
        <div
          class="rounded-2xl p-5 bg-white flex gap-3 items-center border-2 border-gray-200 w-64 max-md:w-full"
        >
          <div class="p-3 rounded-xl flex content-center bg-blue-50">
            <img src="./src/assets/calendar-1.svg" alt="" class="size-4" />
          </div>

          <div>
            <h3 class="text-slate-600 font-semibold text-sm">Total de Reservas</h3>
            <span id="reservations-total" class="text-lg font-bold">0</span>
          </div>
        </div>

        <div
          class="rounded-2xl p-5 bg-white flex gap-3 items-center border-2 border-gray-200 w-64 max-md:w-full"
        >
          <div class="p-3 rounded-xl flex content-center bg-blue-50">
            <img src="./src/assets/calendar-2.svg" alt="" class="size-4" />
          </div>

          <div>
            <h3 class="text-slate-600 font-semibold text-sm">Reservas de Hoje</h3>
            <span id="today-reservations-total" class="text-lg font-bold">0</span>
          </div>
        </div>

        <div
          class="rounded-2xl p-5 bg-white flex gap-3 items-center border-2 border-gray-200 w-64 max-md:w-full"
        >
          <div class="p-3 rounded-xl flex content-center bg-blue-50">
            <img src="./src/assets/moon.svg" alt="" class="size-4" />
          </div>

          <div>
            <h3 class="text-slate-600 font-semibold text-sm">Reservas Noturnas</h3>
            <span id="night-reservations-total" class="text-lg font-bold">0</span>
          </div>
        </div>
      </section>

      <section class="container mx-auto px-8 py-4">
        <div class="rounded-xl p-5 border-2 border-gray-200 bg-white flex flex-col gap-3">
          <span class="font-semibold text-slate-600">Filtrar reservas</span>

          <ul class="flex gap-4 max-sm:flex-col">
            <li class="flex-1">
              <input
                type="text"
                placeholder="Buscar por nome..."
                class="px-3 py-1.5 rounded-xl border-2 border-gray-200 w-full outline-none focus:border-blue-600"
                id="name_filter"
              />
            </li>

            <li class="flex-1">
              <input
                type="date"
                class="px-3 py-1.5 rounded-xl border-2 border-gray-200 w-full outline-none focus:border-blue-600"
                id="date_filter"
              />
            </li>

            <li class="flex-1">
              <select
                type="text"
                placeholder="Buscar por nome..."
                class="px-3 py-1.5 rounded-xl border-2 border-gray-200 w-full outline-none focus:border-blue-600"
                id="block_filter"
              >
                <option value="" selected>Todos os Blocos</option>
              </select>
            </li>

            <li class="flex-1">
              <select
                type="text"
                placeholder="Buscar por nome..."
                class="px-3 py-1.5 rounded-xl border-2 border-gray-200 w-full outline-none focus:border-blue-600"
                id="classroom_filter"
              >
                <option value="" selected>Todas as Salas</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
              </select>
            </li>

            <li>
              <button
                id="clear-filters"
                type="button"
                class="rounded-xl border-2 border-gray-200 px-4 py-1.5 font-semibold cursor-pointer hover:bg-gray-100 max-sm:w-full"
              >
                Limpar filtros
              </button>
            </li>
          </ul>
        </div>
      </section>

      <section class="container mx-auto px-8 py-4">
        <div
          class="overflow-x-auto rounded-xl border-2 border-gray-200 bg-white max-sm:overflow-visible max-sm:border-0 max-sm:bg-transparent"
        >
          <table class="w-full text-left max-sm:block max-sm:text-sm">
            <thead class="border-b-2 border-gray-200 bg-gray-50 max-sm:hidden">
              <tr>
                <th class="p-4 max-sm:p-2">Solicitante</th>
                <th class="p-4 max-sm:p-2">Bloco</th>
                <th class="p-4 max-sm:p-2">Sala</th>
                <th class="p-4 max-sm:p-2">Data</th>
                <th class="p-4 max-sm:p-2">Turno</th>
                <th class="p-4 max-sm:p-2">Ação</th>
              </tr>
            </thead>
            <tbody id="reservations-list" class="max-sm:block"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div
      id="reservation-modal"
      class="hidden fixed inset-0 bg-black/50 p-4 items-center justify-center"
    >
      <div class="w-full max-w-md rounded-xl bg-white p-5">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-xl font-bold">Nova reserva</h2>
          <button id="close-reservation-modal" type="button" class="cursor-pointer text-xl">
            &times;
          </button>
        </div>

        <form id="reservation-form" class="flex flex-col gap-3">
          <input
            id="reservation-applicant"
            class="rounded-xl border-2 border-gray-200 px-3 py-2"
            type="text"
            placeholder="Nome do solicitante"
            required
          />
          <select
            id="reservation-block"
            class="rounded-xl border-2 border-gray-200 px-3 py-2"
            required
          >
            <option value="">Selecione o bloco</option>
          </select>
          <select
            id="reservation-classroom"
            class="rounded-xl border-2 border-gray-200 px-3 py-2"
            required
            disabled
          >
            <option value="">Selecione a sala</option>
          </select>
          <input
            id="reservation-date"
            class="rounded-xl border-2 border-gray-200 px-3 py-2"
            type="date"
            required
          />
          <select
            id="reservation-shift"
            class="rounded-xl border-2 border-gray-200 px-3 py-2"
            required
          >
            <option value="">Selecione o turno</option>
            <option value="Manhã">Manhã</option>
            <option value="Tarde">Tarde</option>
            <option value="Noite">Noite</option>
          </select>

          <button
            type="submit"
            class="rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700 cursor-pointer"
          >
            Salvar reserva
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
